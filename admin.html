<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Nexora Marketplace | Admin Dashboard</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Inter", sans-serif;
      background: #f5f7fc;
      color: #172033;
      padding: 28px;
    }

    .container {
      max-width: 1400px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-bottom: 30px;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      color: #3563f5;
    }

    .header p {
      color: #718096;
      margin-top: 7px;
      font-size: 14px;
    }

    .refresh-btn {
      border: none;
      background: #3563f5;
      color: white;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }

    .refresh-btn:hover {
      background: #244bd0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 20px;
      margin-bottom: 30px;
    }

    .stat-card {
      background: white;
      border: 1px solid #e8edf5;
      padding: 25px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(20, 40, 90, 0.04);
    }

    .stat-card p {
      color: #718096;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .stat-card h2 {
      font-size: 32px;
      font-weight: 800;
    }

    .orders-card {
      background: white;
      border: 1px solid #e8edf5;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 20px rgba(20, 40, 90, 0.04);
    }

    .orders-header {
      padding: 24px;
      border-bottom: 1px solid #edf0f6;
    }

    .orders-header h2 {
      font-size: 20px;
      margin-bottom: 7px;
    }

    .orders-header p {
      color: #718096;
      font-size: 13px;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 950px;
      border-collapse: collapse;
      text-align: left;
    }

    th {
      background: #f8faff;
      color: #667085;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      padding: 17px 20px;
      white-space: nowrap;
    }

    td {
      padding: 19px 20px;
      border-bottom: 1px solid #edf0f6;
      font-size: 13px;
      vertical-align: middle;
    }

    tbody tr:hover {
      background: #fafbff;
    }

    .order-id {
      font-weight: 700;
      color: #3563f5;
    }

    .customer-name {
      font-weight: 600;
      margin-bottom: 5px;
    }

    .customer-phone {
      color: #718096;
      font-size: 12px;
    }

    .product-list {
      min-width: 170px;
      line-height: 1.8;
    }

    .total-price {
      font-weight: 700;
      white-space: nowrap;
    }

    .status {
      display: inline-block;
      padding: 7px 11px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .status.pending {
      background: #fff4d6;
      color: #986500;
    }

    .status.confirmed {
      background: #dcfce7;
      color: #15803d;
    }

    .status.cancelled {
      background: #fee2e2;
      color: #b91c1c;
    }

    .details-btn,
    .confirm-btn {
      border: none;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    .details-btn {
      background: #edf2ff;
      color: #3563f5;
    }

    .details-btn:hover {
      background: #dce6ff;
    }

    .confirm-btn {
      background: #3563f5;
      color: white;
    }

    .confirm-btn:hover {
      background: #244bd0;
    }

    .confirm-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      padding: 35px;
      color: #718096;
    }

    .message.error {
      color: #dc2626;
    }

    /* Order Details Popup */

    .details-modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-y: auto;
    }

    .details-modal[hidden] {
      display: none !important;
    }

    .details-content {
      position: relative;
      width: 100%;
      max-width: 650px;
      max-height: 90vh;
      overflow-y: auto;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
    }

    .details-content h2 {
      font-size: 23px;
      margin-bottom: 25px;
      padding-right: 35px;
    }

    .close-details {
      position: absolute;
      right: 20px;
      top: 18px;
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: #f1f5f9;
      font-size: 19px;
      cursor: pointer;
    }

    .close-details:hover {
      background: #e2e8f0;
    }

    .detail-item {
      padding: 14px 0;
      border-bottom: 1px solid #edf0f6;
      display: grid;
      grid-template-columns: 135px minmax(0, 1fr);
      gap: 12px;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .detail-label {
      color: #718096;
      font-size: 13px;
    }

    .detail-value {
      color: #172033;
      font-size: 13px;
      font-weight: 600;
      white-space: pre-wrap;
    }

    .detail-products {
      margin-top: 18px;
      padding: 18px;
      border-radius: 12px;
      background: #f8faff;
    }

    .detail-products h3 {
      font-size: 15px;
      margin-bottom: 12px;
    }

    .detail-product-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 0;
      border-bottom: 1px solid #e8edf5;
      font-size: 13px;
    }

    .detail-product-row:last-child {
      border-bottom: none;
    }

    .detail-total {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      margin-top: 16px;
      font-size: 17px;
      font-weight: 800;
    }

    @media (max-width: 700px) {
      body {
        padding: 15px;
      }

      .stats {
        grid-template-columns: 1fr;
        gap: 12px;
      }

      .stat-card {
        padding: 20px;
      }

      .stat-card h2 {
        font-size: 27px;
      }

      .orders-header {
        padding: 18px;
      }

      .details-content {
        padding: 23px 18px;
      }

      .details-content h2 {
        font-size: 20px;
      }

      .detail-item {
        grid-template-columns: 1fr;
        gap: 4px;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <header class="header">
      <div>
        <div class="logo">Nexora.</div>
        <p>Marketplace Administration Dashboard</p>
      </div>

      <button class="refresh-btn" id="refresh-btn" type="button">
        ↻ Refresh Orders
      </button>
    </header>

    <section class="stats">
      <div class="stat-card">
        <p>Total Orders</p>
        <h2 id="total-orders">0</h2>
      </div>

      <div class="stat-card">
        <p>Pending Orders</p>
        <h2 id="pending-orders">0</h2>
      </div>

      <div class="stat-card">
        <p>Confirmed Orders</p>
        <h2 id="confirmed-orders">0</h2>
      </div>
    </section>

    <section class="orders-card">
      <div class="orders-header">
        <h2>Customer Orders</h2>
        <p>View order information and confirm pending orders.</p>
      </div>

      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Order ID</th>
              <th>Customer</th>
              <th>Products</th>
              <th>Total</th>
              <th>Status</th>
              <th>Details</th>
              <th>Action</th>
            </tr>
          </thead>

          <tbody id="orders-body">
            <tr>
              <td colspan="7" class="message">
                Loading orders...
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

  </div>

  <!-- Order Details Popup -->

  <div id="details-modal" class="details-modal" hidden>
    <div class="details-content">
      <button
        id="close-details"
        class="close-details"
        type="button"
        aria-label="Close order details"
      >✕</button>

      <h2>Order Details</h2>
      <div id="details-body"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://nexora-marketplace-x4x7.onrender.com";

    const ordersBody = document.getElementById("orders-body");
    const totalOrders = document.getElementById("total-orders");
    const pendingOrders = document.getElementById("pending-orders");
    const confirmedOrders = document.getElementById("confirmed-orders");

    const detailsModal = document.getElementById("details-modal");
    const detailsBody = document.getElementById("details-body");
    const closeDetails = document.getElementById("close-details");

    const refreshButton = document.getElementById("refresh-btn");

    function escapeHTML(value) {
      return String(value ?? "").replace(/[&<>"']/g, function (char) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;"
        };

        return entities[char];
      });
    }

    function formatPrice(value) {
      const price = Number(value);

      if (!Number.isFinite(price)) {
        return "৳0";
      }

      return "৳" + price.toLocaleString("en-BD");
    }

    function getStatus(order) {
      const status = String(order.status || "Pending").toLowerCase();

      if (status.includes("confirm")) {
        return "Confirmed";
      }

      if (status.includes("cancel")) {
        return "Cancelled";
      }

      return "Pending";
    }

    function getProducts(order) {
      const items = order.items || order.products || [];

      if (Array.isArray(items)) {
        return items;
      }

      return [];
    }

    function getOrderTotal(order) {
      const total = Number(
        order.total ??
        order.totalAmount ??
        order.amount ??
        0
      );

      return Number.isFinite(total) ? total : 0;
    }

    function getOrderId(order) {
      return order.id ?? order._id ?? "";
    }

    function showDetails(order) {
      const items = getProducts(order);
      const status = getStatus(order);

      const customerName =
        order.customerName ||
        order.name ||
        order.customer?.name ||
        "Not provided";

      const phone =
        order.phone ||
        order.customerPhone ||
        order.customer?.phone ||
        "Not provided";

      const address =
        order.address ||
        order.customerAddress ||
        order.customer?.address ||
        "Not provided";

      const note =
        order.note ||
        order.orderNote ||
        order.instructions ||
        "Not provided";

      const orderDate =
        order.createdAt ||
        order.date ||
        order.orderDate ||
        "Not provided";

      let productHTML = "";

      if (items.length > 0) {
        productHTML = items.map(function (item) {
          const name =
            item.name ||
            item.productName ||
            "Product";

          const quantity = Number(item.quantity || 1);
          const price = Number(item.price || 0);

          return `
            <div class="detail-product-row">
              <span>
                ${escapeHTML(name)}
                × ${escapeHTML(quantity)}
              </span>
              <strong>
                ${formatPrice(price * quantity)}
              </strong>
            </div>
          `;
        }).join("");
      } else {
        productHTML = `
          <p class="detail-label">No product details available.</p>
        `;
      }

      detailsBody.innerHTML = `
        <div class="detail-item">
          <span class="detail-label">Order ID</span>
          <span class="detail-value">
            #${escapeHTML(getOrderId(order))}
          </span>
        </div>

        <div class="detail-item">
          <span class="detail-label">Customer Name</span>
          <span class="detail-value">
            ${escapeHTML(customerName)}
          </span>
        </div>

        <div class="detail-item">
          <span class="detail-label">Phone Number</span>
          <span class="detail-value">
            ${escapeHTML(phone)}
          </span>
        </div>

        <div class="detail-item">
          <span class="detail-label">Delivery Address</span>
          <span class="detail-value">
            ${escapeHTML(address)}
          </span>
        </div>

        <div class="detail-item">
          <span class="detail-label">Order Status</span>
          <span class="detail-value">
            ${escapeHTML(status)}
          </span>
        </div>

        <div class="detail-item">
          <span class="detail-label">Order Date</span>
          <span class="detail-value">
            ${escapeHTML(orderDate)}
          </span>
        </div>

        <div class="detail-item">
          <span class="detail-label">Customer Note</span>
          <span class="detail-value">
            ${escapeHTML(note)}
          </span>
        </div>

        <div class="detail-products">
          <h3>Ordered Products</h3>
          ${productHTML}

          <div class="detail-total">
            <span>Total</span>
            <span>${formatPrice(getOrderTotal(order))}</span>
          </div>
        </div>
      `;

      detailsModal.hidden = false;
      document.body.style.overflow = "hidden";
    }

    function hideDetails() {
      detailsModal.hidden = true;
      document.body.style.overflow = "";
    }

    closeDetails.addEventListener("click", hideDetails);

    detailsModal.addEventListener("click", function (event) {
      if (event.target === detailsModal) {
        hideDetails();
      }
    });

    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape" && !detailsModal.hidden) {
        hideDetails();
      }
    });

    async function confirmOrder(order) {
      const orderId = getOrderId(order);

      if (!orderId) {
        alert("Order ID পাওয়া যায়নি।");
        return;
      }

      if (getStatus(order) !== "Pending") {
        return;
      }

      const confirmed = window.confirm(
        `আপনি কি Order #${orderId} Confirm করতে চান?`
      );

      if (!confirmed) {
        return;
      }

      try {
        const response = await fetch(
          `${API_URL}/api/orders/${encodeURIComponent(orderId)}/confirm`,
          {
            method: "PATCH"
          }
        );

        const result = await response.json();

        if (!response.ok || result.success === false) {
          throw new Error(
            result.message || "Order confirmation failed."
          );
        }

        alert(`Order #${orderId} successfully confirmed!`);

        await loadOrders();
      } catch (error) {
        console.error("Confirm order error:", error);

        alert(
          "Order Confirm করা যায়নি। Backend API পরীক্ষা করো।\n" +
          error.message
        );
      }
    }

    async function loadOrders() {
      ordersBody.innerHTML = `
        <tr>
          <td colspan="7" class="message">
            Loading orders...
          </td>
        </tr>
      `;

      refreshButton.disabled = true;

      try {
        const response = await fetch(`${API_URL}/api/orders`);

        if (!response.ok) {
          throw new Error("Orders load failed: " + response.status);
        }

        const result = await response.json();

        const orders = result.orders || [];

        totalOrders.textContent = orders.length;

        pendingOrders.textContent = orders.filter(function (order) {
          return getStatus(order) === "Pending";
        }).length;

        confirmedOrders.textContent = orders.filter(function (order) {
          return getStatus(order) === "Confirmed";
        }).length;

        if (orders.length === 0) {
          ordersBody.innerHTML = `
            <tr>
              <td colspan="7" class="message">
                No orders found.
              </td>
            </tr>
          `;

          return;
        }

        ordersBody.innerHTML = "";

        orders.forEach(function (order) {
          const orderId = getOrderId(order);
          const status = getStatus(order);
          const items = getProducts(order);

          const customerName =
            order.customerName ||
            order.name ||
            order.customer?.name ||
            "Not provided";

          const phone =
            order.phone ||
            order.customerPhone ||
            order.customer?.phone ||
            "";

          const productNames = items.length
            ? items.map(function (item) {
                return `
                  <div>
                    ${escapeHTML(item.name || item.productName || "Product")}
                    × ${escapeHTML(item.quantity || 1)}
                  </div>
                `;
              }).join("")
            : "Product details unavailable";

          const row = document.createElement("tr");

          row.innerHTML = `
            <td>
              <span class="order-id">
                #${escapeHTML(orderId)}
              </span>
            </td>

            <td>
              <div class="customer-name">
                ${escapeHTML(customerName)}
              </div>
              <div class="customer-phone">
                ${escapeHTML(phone)}
              </div>
            </td>

            <td>
              <div class="product-list">
                ${productNames}
              </div>
            </td>

            <td>
              <span class="total-price">
                ${formatPrice(getOrderTotal(order))}
              </span>
            </td>

            <td>
              <span class="status ${status.toLowerCase()}">
                ${escapeHTML(status)}
              </span>
            </td>

            <td>
              <button class="details-btn" type="button">
                View Details
              </button>
            </td>

            <td>
              ${
                status === "Pending"
                  ? `<button class="confirm-btn" type="button">Confirm</button>`
                  : `<span class="detail-label">No action</span>`
              }
            </td>
          `;

          row.querySelector(".details-btn").addEventListener(
            "click",
            function () {
              showDetails(order);
            }
          );

          const confirmButton = row.querySelector(".confirm-btn");

          if (confirmButton) {
            confirmButton.addEventListener("click", function () {
              confirmOrder(order);
            });
          }

          ordersBody.appendChild(row);
        });

      } catch (error) {
        console.error("Product loading error:", error);

        ordersBody.innerHTML = `
          <tr>
            <td colspan="7" class="message error">
              Orders load করা যায়নি।<br>
              Backend API route পরীক্ষা করতে হবে।<br>
              ${escapeHTML(error.message)}
            </td>
          </tr>
        `;

      } finally {
        refreshButton.disabled = false;
      }
    }

    refreshButton.addEventListener("click", loadOrders);

    loadOrders();
  </script>
</body>
</html>
